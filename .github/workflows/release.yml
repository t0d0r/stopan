# Release build (specs/release.md "Release build"): starts the reusable
# release-build.yml for a release tag, which builds the source archive
# and attests its SLSA build provenance at Build Level 3. bin/release on
# the maintainer's machine downloads both from the run, checks them,
# signs the archive and publishes the release; nothing here writes to
# the repository or its releases.
name: Release build
run-name: Release build ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]
  # An existing tag, built again (make release-files).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.1"
        required: true
        type: string

# Nothing by default; the call grants what the reusable workflow's jobs
# may use, and each of them takes less.
permissions: {}

concurrency:
  group: release-build-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Release build
    permissions:
      # The build job: check out the tag.
      contents: read
      # The provenance job: sign it (OIDC token) and store it.
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
