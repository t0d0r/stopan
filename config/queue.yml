# Solid Queue in production: one dispatcher and one worker of 3 threads,
# run inside Puma (specs/notifications.md "Delivery").
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
